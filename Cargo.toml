[package]
name = "deepseek-mcp"
version = "0.3.0"
edition = "2024"
description = "Stdio MCP server + long-lived local daemon for DeepSeek Search and Fetch"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
dirs = "7"
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
